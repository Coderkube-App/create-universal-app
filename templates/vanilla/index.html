<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Vanilla App</title>
    <style>
      :root {
        font-family: 'Outfit', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        line-height: 1.5;
        font-weight: 400;
        color-scheme: dark light;
        color: rgba(255, 255, 255, 0.87);
        background-color: #0f172a;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        display: flex;
        place-items: center;
        min-width: 320px;
        min-height: 100vh;
      }

      #app {
        max-width: 1280px;
        margin: 0 auto;
        padding: 2rem;
        text-align: center;
      }

      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 2em;
        border-radius: 16px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      h1 {
        font-size: 3.2em;
        line-height: 1.1;
        margin-bottom: 0.2em;
        background: linear-gradient(to right, #38BDF8, #818CF8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      button {
        border-radius: 8px;
        border: 1px solid transparent;
        padding: 0.6em 1.2em;
        font-size: 1em;
        font-weight: 500;
        font-family: inherit;
        background-color: #6366f1;
        color: white;
        cursor: pointer;
        transition: all 0.25s ease;
      }
      button:hover {
        background-color: #4f46e5;
        transform: translateY(-2px);
      }
      button:active {
        transform: translateY(0);
      }

      p {
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="card">
        <h1>Universal Vanilla App</h1>
        <p>Scaffolded perfectly using <code>create-universal-app</code>.</p>
        <div style="margin-top: 2rem;">
          <button id="counter" type="button">count is 0</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
